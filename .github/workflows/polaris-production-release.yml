name: Polaris production-version candidates
on:
  workflow_dispatch:
    inputs:
      attest:
        description: Generate provenance after approved main integration; does not publish a release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: polaris-production-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'polaris-arch/polaris-box'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          path: producer
          persist-credentials: false
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          python3 producer/scripts/polaris_production_release.py plan > "$RUNNER_TEMP/polaris-plan.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads((Path(os.environ['RUNNER_TEMP']) / 'polaris-plan.json').read_bytes())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(plan['matrix'], separators=(',', ':')) + '\n')
          PY
  native:
    needs: plan
    name: Production ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOWORK: 'off'
      GOFLAGS: ''
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          path: producer
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.5'
          architecture: ${{ matrix.tool_arch }}
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: ${{ matrix.os == 'windows' && 'x64' || matrix.tool_arch }}
      - name: Build actual version, verify patched source, native capabilities and final archive
        shell: bash
        env:
          PRODUCTION_TARGET: ${{ matrix.os }}/${{ matrix.arch }}
          GOMODCACHE: ${{ runner.temp }}/polaris-production-gomod
          GOCACHE: ${{ runner.temp }}/polaris-production-gocache
        run: |
          set -euo pipefail
          python producer/scripts/polaris_production_release.py native \
            --source "$GITHUB_WORKSPACE/source" --expected-head "$GITHUB_SHA" \
            --target "$PRODUCTION_TARGET" --output "$RUNNER_TEMP/polaris-production"
      - name: Preserve actual output and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: polaris-box-production-${{ matrix.os }}-${{ matrix.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/polaris-production
          if-no-files-found: warn
          retention-days: 14
  assemble:
    needs: [plan, native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          path: producer
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.5'
          cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: polaris-box-production-*-${{ github.run_id }}
          path: ${{ runner.temp }}/native-inputs
      - name: Assemble one same-run six-platform distribution and standalone source
        shell: bash
        run: |
          set -euo pipefail
          python3 producer/scripts/polaris_production_release.py fetch-source \
            --output "$RUNNER_TEMP/polaris-box-a01-desktop-source-candidate-six-platforms-v4.tar.gz"
          python3 producer/scripts/polaris_production_release.py assemble \
            --expected-head "$GITHUB_SHA" --inputs "$RUNNER_TEMP/native-inputs" \
            --reused-source "$RUNNER_TEMP/polaris-box-a01-desktop-source-candidate-six-platforms-v4.tar.gz" \
            --output "$RUNNER_TEMP/polaris-production-final"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: polaris-box-production-final-${{ github.run_id }}
          path: ${{ runner.temp }}/polaris-production-final
          if-no-files-found: error
          retention-days: 14
  provenance:
    if: inputs.attest && github.ref == 'refs/heads/polaris-main'
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: polaris-box-production-final-${{ github.run_id }}
          path: final
      - id: attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: final/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: polaris-box-production-provenance-${{ github.run_id }}
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 14
