name: Polaris whole-batch desktop and OpenWrt candidates
on:
  workflow_dispatch:
    inputs:
      attest:
        description: Generate provenance after approved main integration; does not publish a release
        type: boolean
        default: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
permissions:
  contents: read
concurrency:
  group: polaris-production-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'polaris-arch/polaris-box'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          path: producer
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.5'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Whole-batch source contracts and regressions
        shell: bash
        env:
          GOENV: 'off'
          GOWORK: 'off'
          GOFLAGS: ''
          GOTOOLCHAIN: local
          GOMAXPROCS: '2'
          GOMODCACHE: ${{ runner.temp }}/batch-test-gomod
          GOCACHE: ${{ runner.temp }}/batch-test-gocache
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s producer/scripts -p 'test_polaris_*.py' -v 2>&1 | tee "$RUNNER_TEMP/whole-batch-contracts.log"
      - name: Preserve batch contract results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: polaris-box-batch-contracts-${{ github.run_id }}
          path: ${{ runner.temp }}/whole-batch-contracts.log
          if-no-files-found: warn
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          python3 -B producer/scripts/polaris_production_release.py plan > "$RUNNER_TEMP/polaris-plan.json"
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads((Path(os.environ['RUNNER_TEMP']) / 'polaris-plan.json').read_bytes())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(plan['matrix'], separators=(',', ':')) + '\n')
          PY
  native:
    needs: plan
    name: Production ${{ matrix.kind }} ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOWORK: 'off'
      GOFLAGS: ''
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          path: producer
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.5'
          architecture: ${{ matrix.tool_arch }}
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: ${{ matrix.os == 'windows' && 'x64' || matrix.tool_arch == 'amd64' && 'x64' || matrix.tool_arch }}
      - name: OpenWrt package tools on the ephemeral runner
        if: matrix.kind == 'openwrt'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd qemu-user fakeroot
      - name: Build actual version, verify patched source, native capabilities and final archive
        shell: bash
        env:
          PRODUCTION_TARGET: ${{ matrix.os }}/${{ matrix.arch }}
          PRODUCTION_KIND: ${{ matrix.kind }}
          OPENWRT_ARCH: ${{ matrix.arch }}
          GOMODCACHE: ${{ runner.temp }}/polaris-production-gomod
          GOCACHE: ${{ runner.temp }}/polaris-production-gocache
        run: |
          set -euo pipefail
          if [[ "$PRODUCTION_KIND" == desktop ]]; then
            python -B producer/scripts/polaris_production_release.py native \
              --source "$GITHUB_WORKSPACE/source" --expected-head "$GITHUB_SHA" \
              --target "$PRODUCTION_TARGET" --output "$RUNNER_TEMP/polaris-production"
          else
            python -B producer/scripts/polaris_openwrt.py native \
              --source "$GITHUB_WORKSPACE/source" --expected-head "$GITHUB_SHA" \
              --architecture "$OPENWRT_ARCH" --cache "$RUNNER_TEMP/openwrt-cache" \
              --output "$RUNNER_TEMP/polaris-production"
          fi
      - name: Freeze bounded CI handoff layout
        if: always()
        shell: bash
        run: |
          python -B - <<'PYHANDOFF'
          import hashlib, json, os, shutil
          from pathlib import Path
          source=Path(os.environ['RUNNER_TEMP'])/'polaris-production'
          output=Path(os.environ['RUNNER_TEMP'])/'polaris-handoff'
          output.mkdir(exist_ok=False)
          if source.exists():
              for path in source.iterdir():
                  if path.name.startswith('work-') or path.name=='technical' and (source/'final').exists():
                      continue
                  dest=output/path.name
                  if path.name=='test-inputs':
                      dest.mkdir()
                      for file in path.iterdir():
                          if file.is_file() and file.suffix in ('.apk','.ipk'):
                              shutil.copyfile(file,dest/file.name)
                  elif path.is_dir():shutil.copytree(path,dest)
                  elif path.is_file():shutil.copyfile(path,dest)
          rows={str(p.relative_to(output)):{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in output.rglob('*') if p.is_file()}
          (output/'HANDOFF-IDENTITY.json').write_text(json.dumps({'sourceCommit':os.environ['GITHUB_SHA'],'workflowRun':os.environ['GITHUB_RUN_ID'],'workflowAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'files':rows},indent=2)+'\n')
          PYHANDOFF
      - name: Preserve actual output and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: polaris-box-production-${{ matrix.kind }}-${{ matrix.os }}-${{ matrix.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/polaris-handoff
          if-no-files-found: warn
          retention-days: 14
  openwrt-guests:
    needs: [plan, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        architecture: [x86_64, aarch64_generic]
        format: [ipk, apk]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          path: producer
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: polaris-box-production-openwrt-openwrt-${{ matrix.architecture }}-${{ github.run_id }}
          path: ${{ runner.temp }}/openwrt-inputs
      - name: Ephemeral isolated VM tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-system-arm qemu-user e2fsprogs openssh-client openssl
      - name: Actual official guest package and runtime gates
        shell: bash
        env:
          OPENWRT_ARCH: ${{ matrix.architecture }}
          PACKAGE_FORMAT: ${{ matrix.format }}
        run: |
          set -euo pipefail
          python3 -B producer/scripts/polaris_openwrt_guest.py \
            --expected-head "$GITHUB_SHA" --architecture "$OPENWRT_ARCH" --format "$PACKAGE_FORMAT" \
            --inputs "$RUNNER_TEMP/openwrt-inputs" --output "$RUNNER_TEMP/openwrt-guest"
      - name: Preserve guest receipts and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: polaris-box-openwrt-guest-${{ matrix.architecture }}-${{ matrix.format }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/openwrt-guest/guest-receipt.json
            ${{ runner.temp }}/openwrt-guest/GUEST-FAILURE.json
            ${{ runner.temp }}/openwrt-guest/REPOSITORY-PREPARATION.json
            ${{ runner.temp }}/openwrt-guest/*.log
            ${{ runner.temp }}/openwrt-guest/*-observation.json
            ${{ runner.temp }}/openwrt-guest/naive-tls-h2/*.json
            ${{ runner.temp }}/openwrt-guest/naive-tls-h2/*.log
            ${{ runner.temp }}/openwrt-guest/naive-tls-h2/*.crt
            ${{ runner.temp }}/openwrt-guest/naive-tls-h2/*-response.bin
          if-no-files-found: warn
          retention-days: 14
  assemble:
    needs: [plan, native, openwrt-guests]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          path: producer
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.5'
          cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: polaris-box-production-desktop-*-${{ github.run_id }}
          path: ${{ runner.temp }}/native-inputs
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: polaris-box-production-openwrt-*-${{ github.run_id }}
          path: ${{ runner.temp }}/openwrt-inputs
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: polaris-box-openwrt-guest-*-${{ github.run_id }}
          path: ${{ runner.temp }}/guest-inputs
      - name: Assemble same-run twelve assets and fixed public source references
        shell: bash
        run: |
          set -euo pipefail
          python3 -B producer/scripts/polaris_production_release.py assemble \
            --expected-head "$GITHUB_SHA" --inputs "$RUNNER_TEMP/native-inputs" \
            --openwrt-inputs "$RUNNER_TEMP/openwrt-inputs" --guest-inputs "$RUNNER_TEMP/guest-inputs" \
            --output "$RUNNER_TEMP/polaris-production-final"
      - name: Preserve full-byte source availability checks and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: polaris-box-public-source-${{ github.run_id }}
          path: ${{ runner.temp }}/public-source-check/*.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: polaris-box-production-final-${{ github.run_id }}
          path: ${{ runner.temp }}/polaris-production-final
          if-no-files-found: error
          retention-days: 14
  provenance:
    if: inputs.attest && github.ref == 'refs/heads/polaris-main'
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: polaris-box-production-final-${{ github.run_id }}
          path: final
      - id: attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: final/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: polaris-box-production-provenance-${{ github.run_id }}
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 14
